<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANGUARD PROTOCOL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "tactical-dark": "#090b10",
              "tactical-panel": "#0f141d",
              "tactical-accent": "#ff4655",
              "tactical-cyan": "#00f0ff",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #090b10;
        color: #e2e8f0;
        background-image:
          linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .cut-corner {
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 16px),
          calc(100% - 16px) 100%,
          0 100%
        );
      }
    </style>
  </head>
  <body class="font-sans antialiased selection:bg-tactical-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
